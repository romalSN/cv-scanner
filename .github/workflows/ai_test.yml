name: AI-test (lokale modellen)
on:
  push:
    paths:
      - 'ai_test/**'
      - '.github/workflows/ai_test.yml'
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - naam: Phi-3.5-mini
            url: https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf
          - naam: Qwen2.5-3B
            url: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
          - naam: Qwen2.5-7B
            url: https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          - naam: Qwen3.5-4B
            url: https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf
          - naam: Qwen3.5-9B
            url: https://huggingface.co/bartowski/Qwen_Qwen3.5-9B-GGUF/resolve/main/Qwen_Qwen3.5-9B-Q4_K_M.gguf
          - naam: Llama-3.1-8B
            url: https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: llama-cpp-python installeren
        run: |
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu > pip.txt 2>&1 \
            || { echo "::error::pip: $(tail -5 pip.txt | tr '\n' ' ')"; exit 1; }
          python -c "import llama_cpp; print('::notice::llama-cpp-python', llama_cpp.__version__)"
      - name: Model ophalen
        run: |
          curl -sL --fail -o model.gguf "${{ matrix.url }}"
          echo "::notice::${{ matrix.naam }}: $(du -h model.gguf | cut -f1)"
      - name: Beoordelen
        run: python ai_test/evalueer.py model.gguf "${{ matrix.naam }}" 2>&1 | tail -40
      - name: Twijfelgevallen beoordelen (cv of niet)
        if: false
        run: CV_AI_MODEL=model.gguf python ai_test/evalueer_twijfel.py model.gguf "${{ matrix.naam }}" 2>&1 | tail -30
      - name: Dubbele kandidaten (zelfde persoon?)
        run: python ai_test/evalueer_dubbel.py model.gguf "${{ matrix.naam }}" 2>&1 | tail -20
      - name: Woonplaats (woont nu in NL/BE?)
        run: python ai_test/evalueer_woont.py model.gguf "${{ matrix.naam }}" 2>&1 | tail -20
