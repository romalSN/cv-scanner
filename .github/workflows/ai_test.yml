name: AI-test (lokale modellen)
on:
  push:
    paths:
      - 'ai_test/**'
      - '.github/workflows/ai_test.yml'
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - naam: Llama-3.2-3B
            url: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf
          - naam: Phi-3.5-mini
            url: https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf
          - naam: Qwen2.5-1.5B
            url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          - naam: Qwen2.5-7B
            url: https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          - naam: Gemma-2-2B
            url: https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp ophalen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api repos/ggml-org/llama.cpp/releases/latest -q '.tag_name, (.assets[].name)' > assets.txt 2> err.txt
          echo "::notice::assets: $(grep -iE 'ubuntu|linux|b[0-9]+$' assets.txt | tr '\n' ' ') $(cat err.txt | tr '\n' ' ')"
          NAME=$(grep -iE 'bin-ubuntu-x64\.(zip|tar\.gz)$' assets.txt | head -1)
          TAG=$(head -1 assets.txt)
          mkdir -p llama && cd llama
          curl -sL --fail -o "$NAME" "https://github.com/ggml-org/llama.cpp/releases/download/$TAG/$NAME" || { echo "::error::download $TAG/$NAME mislukt"; exit 1; }
          case "$NAME" in *.zip) unzip -q "$NAME";; *.tar.gz) tar xzf "$NAME";; esac
          SERVER=$(find "$PWD" -name llama-server -type f | head -1)
          [ -n "$SERVER" ] || { echo "::error::geen llama-server in $NAME: $(find . -maxdepth 3 | head -20 | tr '\n' ' ')"; exit 1; }
          chmod +x "$SERVER"
          echo "LD_LIBRARY_PATH=$(dirname $SERVER)" >> $GITHUB_ENV
          echo "SERVER=$SERVER" >> $GITHUB_ENV
          "$SERVER" --version 2>&1 | head -2 | sed 's/^/::notice::versie /'
      - name: Model ophalen
        run: |
          curl -sL --fail -o model.gguf "${{ matrix.url }}"
          echo "::notice::${{ matrix.naam }}: $(du -h model.gguf | cut -f1)"
      - name: Beoordelen
        run: python3 ai_test/evalueer.py "$SERVER" model.gguf "${{ matrix.naam }}"
