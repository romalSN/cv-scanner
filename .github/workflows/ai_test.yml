name: AI-test (lokale modellen)
on:
  push:
    paths:
      - 'ai_test/**'
      - '.github/workflows/ai_test.yml'
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - naam: Llama-3.2-3B
            url: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf
          - naam: Phi-3.5-mini
            url: https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf
          - naam: Qwen2.5-1.5B
            url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          - naam: Gemma-2-2B
            url: https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: llama-cpp-python installeren
        run: |
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu > pip.txt 2>&1 \
            || { echo "::error::pip: $(tail -5 pip.txt | tr '\n' ' ')"; exit 1; }
          python -c "import llama_cpp; print('::notice::llama-cpp-python', llama_cpp.__version__)"
      - name: Model ophalen
        run: |
          curl -sL --fail -o model.gguf "${{ matrix.url }}"
          echo "::notice::${{ matrix.naam }}: $(du -h model.gguf | cut -f1)"
      - name: Beoordelen
        run: python ai_test/evalueer.py model.gguf "${{ matrix.naam }}" 2>&1 | tail -40
