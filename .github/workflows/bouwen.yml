name: Bouwen (.exe en .app)

on:
  push:
    paths-ignore:
      - 'ai_test/**'
      - '.github/workflows/ai_test.yml'
  workflow_dispatch:

env:
  CV_AI: '0'      # tests en bouwtest: geen echt AI-model (2,4 GB) ophalen; de AI-test gebruikt een eigen testmodel

jobs:
  bouwen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: Windows
          - os: macos-15          # Mac met M-chip (M1/M2/M3/M4)
            naam: Mac-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Benodigdheden installeren
        run: python -m pip install pyinstaller cryptography pillow certifi

      - name: AI-onderdelen installeren (llama-cpp-python)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$(uname -m)" = "arm64" ]; then IDX=metal; else IDX=cpu; fi
          # 1. kant-en-klaar pakket; 2. lukt dat niet: zelf bouwen uit de broncode (duurt langer)
          python -m pip install llama-cpp-python --prefer-binary --no-cache-dir \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/$IDX > pip_ai.txt 2>&1 \
          || { echo "::notice::kant-en-klaar ($IDX) lukte niet, nu zelf bouwen"; \
               python -m pip install llama-cpp-python --no-binary llama-cpp-python --no-cache-dir > pip_ai2.txt 2>&1 \
               || { echo "::error::llama-cpp-python bouwen mislukt: $(tail -5 pip_ai2.txt | tr '\n' ' ')"; exit 1; }; }
          python -c "import llama_cpp; print('::notice::llama-cpp-python', llama_cpp.__version__)"

      - name: Klein testmodel ophalen (alleen voor de test, zit niet in de app)
        shell: bash
        run: curl -sL --fail -o "$RUNNER_TEMP/test.gguf" https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

      - name: Test - tekst, Pages en scanner
        run: python tests/test_basis.py

      - name: Test - venster Kandidaten (tabel in de scanner)
        run: python tests/test_kandidaten.py

      - name: Test - Apify (nagebootst)
        run: python tests/test_apify.py

      - name: Test - sleutelbestand wordt automatisch op de juiste plek gezet
        run: python tests/test_sleutels.py

      - name: Test - 5.000 verzonnen cv-paren (dubbelen samen, naamgenoten nooit)
        run: python tests/test_dubbel_paren.py

      - name: Test - 8 personen met 2 cv-versies (1 zonder contact, andere opmaak, bureau-cv) + naamgenoten
        run: python tests/test_dubbel_versies.py

      - name: Test - opleidingsconflict is apart (geen twijfel); bachelor/master blijft mogelijk
        run: python tests/test_opleiding_conflict.py

      - name: Test - samenvoegen + opschonen (nieuwste cv blijft, oudere versie en kopie weg, terugzetten)
        run: python tests/test_opschonen_dubbel.py

      - name: Test - 30 cv's mee/weg (taal, woonplaats, 5 jaar NL/BE; 0 onterecht uitgesloten)
        run: python tests/test_uitsluiting.py

      - name: Test - alle afgesproken regels (matching, plaatsen, typfouten, cloud, sleutels, Pages)
        run: python tests/test_regels.py

      - name: Test - Mac leest oude Word-bestanden met verkeerde extensie
        if: runner.os == 'macOS'
        run: python tests/test_mac_lezen.py

      - name: Test - ingebouwde Mac-OCR (gescande pdf)
        if: runner.os == 'macOS'      # Windows-OCR is al getest op de Lenovo
        run: python tests/test_ocr.py

      - name: App bouwen
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="--osx-bundle-identifier nl.solutionnow.cvscanner"; fi
          pyinstaller --noconfirm --windowed --name "CV Scanner" --paths . \
            --hidden-import gui --hidden-import cv_crawler --hidden-import reader_worker \
            --hidden-import rtf_reader --hidden-import pages_reader --hidden-import certifi \
            --collect-data certifi --collect-submodules pypdf \
            --hidden-import ai_rechter --hidden-import apify_linkedin --hidden-import profielbron --collect-all llama_cpp $EXTRA start_app.py

      - name: Gebouwde app testen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then APP="dist/CV Scanner.app/Contents/MacOS/CV Scanner"; else APP="dist/CV Scanner/CV Scanner.exe"; fi
          python tests/maak_frozen_set.py "$RUNNER_TEMP/set"
          "$APP" --backend --root "$RUNNER_TEMP/set" --output "$RUNNER_TEMP/uit" > log.txt 2>&1 || true
          cat log.txt
          N=$(grep -c "CV GEVONDEN" log.txt || true)
          if [ "$RUNNER_OS" = "macOS" ]; then WANT=3; else WANT=2; fi
          [ "$N" -ge "$WANT" ] || { echo "::error::Gebouwde app vond $N van $WANT cv's (tekst, Pages, gescande pdf)"; exit 1; }
          "$APP" --ssl-test > ssl.txt 2>&1 || true
          cat ssl.txt
          grep -q "SSL OK" ssl.txt || { echo "::error::Internet (https) werkt niet in de gebouwde app: $(cat ssl.txt)"; exit 1; }
          "$APP" --ai-test "$RUNNER_TEMP/test.gguf" > ai.txt 2>&1 || true
          cat ai.txt
          grep -q "AI OK" ai.txt || { echo "::error::Lokale AI werkt niet in de gebouwde app: $(tail -3 ai.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(grep 'AI OK' ai.txt)"
          grep -q "EXPORT:" log.txt
          grep -q "CV GEVONDEN" log.txt
          ls "$RUNNER_TEMP/uit"/*.xlsx

      - name: Schermafbeelding van de Mac-app
        if: runner.os == 'macOS'
        run: |
          open "dist/CV Scanner.app"
          sleep 25
          screencapture -x mac_scherm.png || true
          pkill -f "CV Scanner" || true

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.naam }}-schermafbeelding
          path: mac_scherm.png

      - name: Inpakken (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/CV Scanner.app" "CV-Scanner-${{ matrix.naam }}.zip"

      - name: Inpakken (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/CV Scanner" -DestinationPath "CV-Scanner-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CV-Scanner-${{ matrix.naam }}
          path: CV-Scanner-*.zip

