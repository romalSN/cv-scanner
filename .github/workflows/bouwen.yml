name: Bouwen (.exe en .app)

on:
  push:
    paths-ignore:
      - 'ai_test/**'
      - '.github/workflows/ai_test.yml'
  workflow_dispatch:

env:
  CV_AI: '0'      # tests en bouwtest: geen echt AI-model (2,4 GB) ophalen; de AI-test gebruikt een eigen testmodel

# Houd per branch alleen de nieuwste build over als er toch kort na elkaar wordt gepusht.
concurrency:
  group: cv-scanner-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouwen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: Windows
          - os: macos-15          # Mac met M-chip (M1/M2/M3/M4)
            naam: Mac-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runner is Apple Silicon
        if: runner.os == 'macOS'
        run: |
          echo "uname=$(uname -m) runner=${{ runner.arch }}"
          [ "$(uname -m)" = "arm64" ]
          [ "${{ runner.arch }}" = "ARM64" ]
          python -c "import platform; assert platform.machine()=='arm64', platform.machine()"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ runner.arch }}-py312-v1

      - name: Benodigdheden installeren
        run: python -m pip install pyinstaller cryptography pillow certifi

      - name: AI-onderdelen installeren (llama-cpp-python)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            [ "$(uname -m)" = "arm64" ]
            IDX=metal
            export ARCHFLAGS="-arch arm64"
            export CMAKE_ARGS="-DGGML_METAL=on"
          else
            IDX=cpu
          fi
          # 1. kant-en-klaar pakket; 2. lukt dat niet: zelf bouwen uit de broncode (duurt langer)
          python -m pip install llama-cpp-python --prefer-binary \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/$IDX > pip_ai.txt 2>&1 \
          || { echo "::notice::kant-en-klaar ($IDX) lukte niet, nu zelf bouwen"; \
               python -m pip install llama-cpp-python --no-binary llama-cpp-python > pip_ai2.txt 2>&1 \
               || { echo "::error::llama-cpp-python bouwen mislukt: $(tail -5 pip_ai2.txt | tr '\n' ' ')"; exit 1; }; }
          python -c "import llama_cpp; print('::notice::llama-cpp-python', llama_cpp.__version__)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            LLAMA=$(python -c "import llama_cpp, pathlib; print(pathlib.Path(llama_cpp.__file__).resolve().parent)")
            gevonden=0
            while IFS= read -r f; do
              a=$(lipo -archs "$f")
              echo "$a  $f"
              echo "$a" | grep -qw arm64 || { echo "::error::llama is niet native ARM64: $f ($a)"; exit 1; }
              [ "$a" != "x86_64" ] || { echo "::error::llama is Intel-only: $f"; exit 1; }
              gevonden=1
            done < <(find "$LLAMA" -type f \( -name '*.so' -o -name '*.dylib' \))
            [ "$gevonden" = 1 ] || { echo "::error::geen llama-binary gevonden"; exit 1; }
          fi

      - name: Klein testmodel ophalen (alleen voor de test, zit niet in de app)
        shell: bash
        run: curl -sL --fail -o "$RUNNER_TEMP/test.gguf" https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_basis.py
            tests/test_kandidaten.py
            tests/test_excel_links.py
            tests/test_linkedin_zoek.py
            tests/test_goma.py
            tests/test_apify.py
            tests/test_sleutels.py
            tests/test_dubbel_paren.py
            tests/test_dubbel_versies.py
            tests/test_opleiding_conflict.py
            tests/test_cv_context.py
            tests/test_opschonen_dubbel.py
            tests/test_uitsluiting.py
            tests/test_regels.py
            tests/test_stresstest.py
          )
          if [ "$RUNNER_OS" = "macOS" ]; then
            tests+=(tests/test_mac_lezen.py tests/test_ocr.py)
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

      - name: App bouwen
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="--osx-bundle-identifier nl.solutionnow.cvscanner"; fi
          pyinstaller --noconfirm --windowed --name "CV Scanner" --paths . \
            --hidden-import gui --hidden-import cv_crawler --hidden-import linkedin_zoek --hidden-import goma_linkedin --hidden-import reader_worker \
            --hidden-import rtf_reader --hidden-import pages_reader --hidden-import certifi \
            --collect-data certifi --collect-submodules pypdf \
            --hidden-import ai_rechter --hidden-import apify_linkedin --hidden-import profielbron --collect-all llama_cpp $EXTRA start_app.py

      - name: Gebouwde app testen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="dist/CV Scanner.app/Contents/MacOS/CV Scanner"
            run_app() { arch -arm64 "$APP" "$@"; }
            hoofd=$(lipo -archs "$APP")
            echo "LIPO hoofdprogramma: $hoofd"
            echo "$hoofd" | grep -qw arm64 || { echo "::error::De app bevat geen ARM64 ($hoofd)"; exit 1; }
            [ "$hoofd" != "x86_64" ] || { echo "::error::Intel-only build"; exit 1; }
            echo "::notice::lipo -archs: $hoofd"
            fout=0
            while IFS= read -r f; do
              if file "$f" | grep -q 'Mach-O'; then
                a=$(lipo -archs "$f" 2>/dev/null || echo '?')
                echo "$a  $f"
                echo "$a" | grep -qw arm64 || { echo "::error::geen ARM64: $f ($a)"; fout=1; }
                [ "$a" != "x86_64" ] || { echo "::error::Intel-only: $f"; fout=1; }
              fi
            done < <(find "dist/CV Scanner.app" -type f)
            [ "$fout" = 0 ]
          else
            APP="dist/CV Scanner/CV Scanner.exe"
            run_app() { "$APP" "$@"; }
          fi
          python tests/maak_frozen_set.py "$RUNNER_TEMP/set"
          run_app --backend --root "$RUNNER_TEMP/set" --output "$RUNNER_TEMP/uit" > log.txt 2>&1 || true
          cat log.txt
          N=$(grep -c "CV GEVONDEN" log.txt || true)
          if [ "$RUNNER_OS" = "macOS" ]; then WANT=3; else WANT=2; fi
          [ "$N" -ge "$WANT" ] || { echo "::error::Gebouwde app vond $N van $WANT cv's (tekst, Pages, gescande pdf)"; exit 1; }
          run_app --ssl-test > ssl.txt 2>&1 || true
          cat ssl.txt
          grep -q "SSL OK" ssl.txt || { echo "::error::Internet (https) werkt niet in de gebouwde app: $(cat ssl.txt)"; exit 1; }
          run_app --ai-test "$RUNNER_TEMP/test.gguf" > ai.txt 2>&1 || true
          cat ai.txt
          grep -q "AI OK" ai.txt || { echo "::error::Lokale AI werkt niet in de gebouwde app: $(tail -3 ai.txt | tr '\n' ' ')"; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            grep -q "arch=arm64" ai.txt || { echo "::error::De AI draait niet native op Apple Silicon: $(grep 'AI OK' ai.txt)"; exit 1; }
          fi
          echo "::notice::$(grep 'AI OK' ai.txt)"
          grep -q "EXPORT:" log.txt
          grep -q "CV GEVONDEN" log.txt
          ls "$RUNNER_TEMP/uit"/*.xlsx

      - name: Schermafbeelding van de Mac-app
        if: runner.os == 'macOS'
        run: |
          open "dist/CV Scanner.app"
          sleep 25
          screencapture -x mac_scherm.png || true
          pkill -f "CV Scanner" || true

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.naam }}-schermafbeelding
          path: mac_scherm.png

      - name: Inpakken (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/CV Scanner.app" "CV-Scanner-${{ matrix.naam }}.zip"

      - name: Inpakken (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/CV Scanner" -DestinationPath "CV-Scanner-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CV-Scanner-${{ matrix.naam }}
          path: CV-Scanner-*.zip

